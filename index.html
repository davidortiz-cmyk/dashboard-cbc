<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard CBC - Métricas Embajadores</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --border: #e2e8f0;
      --text: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      margin: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; color: var(--primary); margin: 0; font-weight: 700; }
    .btn-update {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }
    .table-card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th { background: #f1f5f9; color: var(--primary); font-weight: 600; }
    tr:hover { background: #f8fafc; }
    .id-code { font-family: monospace; color: #64748b; font-size: 0.75rem; }
    .badge-cr { font-weight: 700; color: #047857; background: #ecfdf5; padding: 4px 8px; border-radius: 6px; }
  </style>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>

  <div class="header">
    <h1>Métricas de Embajadores (CBC)</h1>
    <button class="btn-update" onclick="cargarDatos()">Actualizar Datos</button>
  </div>

  <div class="table-card">
    <table id="tabla-cbc">
      <thead>
        <tr id="headers-row">
          <th>Cargando encabezados...</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Cargando datos en tiempo real...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(cargarDatos);

    function cargarDatos() {
      const gvizUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQth53qvQzjQLSzckTa3tvVoD9-LIA-l4Oz0f0K-YbOaBj_HDYVq33iM1LYd3hjNw/gviz/tq?gid=1055035539';
      const query = new google.visualization.Query(gvizUrl);
      query.send(handleQueryResponse);
    }

    function handleQueryResponse(response) {
      if (response.isError()) {
        console.error(response.getMessage());
        return;
      }

      const data = response.getDataTable();
      const numCols = data.getNumberOfColumns();
      const numRows = data.getNumberOfRows();

      // Encabezados
      const thead = document.querySelector('#headers-row');
      thead.innerHTML = '';
      for (let c = 0; c < numCols; c++) {
        const th = document.createElement('th');
        th.textContent = data.getFormattedValue(0, c) || data.getColumnLabel(c);
        thead.appendChild(th);
      }

      // Filas
      const tbody = document.querySelector('#tabla-cbc tbody');
      tbody.innerHTML = '';

      for (let r = 1; r < numRows; r++) {
        const tr = document.createElement('tr');
        for (let c = 0; c < numCols; c++) {
          const val = data.getFormattedValue(r, c) || '-';
          const td = document.createElement('td');
          
          if (c === 0) td.innerHTML = `<strong>${val}</strong>`;
          else if (c === 1) { td.className = 'id-code'; td.textContent = val; }
          else if (c === 2) { td.innerHTML = `<span class="badge-cr">${val}</span>`; }
          else td.textContent = val;
          
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }
  </script>

</body>
</html>
